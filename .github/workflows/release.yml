name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare application icon
        shell: pwsh
        run: scripts\Prepare-Assets.ps1
      - name: Build lightweight app
        run: dotnet publish src\BatteryPilot\BatteryPilot.csproj -c Release -o artifacts\publish
      - name: Build installer
        run: dotnet publish src\BatteryPilot.Installer\Installer.csproj -c Release -o artifacts\publish
      - name: Build uninstaller
        run: dotnet publish src\BatteryPilot.Uninstaller\Uninstaller.csproj -c Release -o artifacts\publish
      - name: Add documentation and remove build-only configs
        shell: pwsh
        run: |
          Remove-Item artifacts\publish\*.config -Force -ErrorAction SilentlyContinue
          Copy-Item README.md,LICENSE artifacts\publish
          @'
          INSTALL: double-click "INSTALL BatteryPilot.exe"
          PORTABLE: double-click "BatteryPilot.exe"
          UNINSTALL: use Windows Settings > Apps or "UNINSTALL BatteryPilot.exe"
          Requires Windows 10/11 with .NET Framework 4.8.
          '@ | Set-Content artifacts\publish\READ-ME-FIRST.txt
      - name: Create release archive and checksum
        shell: pwsh
        run: |
          Compress-Archive artifacts\publish\* artifacts\BatteryPilot-win-x64.zip
          (Get-FileHash artifacts\BatteryPilot-win-x64.zip -Algorithm SHA256).Hash + '  BatteryPilot-win-x64.zip' | Set-Content artifacts\BatteryPilot-win-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryPilot-win-x64
          path: |
            artifacts/BatteryPilot-win-x64.zip
            artifacts/BatteryPilot-win-x64.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BatteryPilot-win-x64.zip
            artifacts/BatteryPilot-win-x64.sha256
