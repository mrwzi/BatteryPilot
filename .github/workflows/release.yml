name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare application icon
        shell: pwsh
        run: scripts\Prepare-Assets.ps1
      - name: Build application payload
        run: dotnet publish src\BatteryPilot\BatteryPilot.csproj -c Release -o artifacts\payload
      - name: Build uninstaller payload
        run: dotnet publish src\BatteryPilot.Uninstaller\Uninstaller.csproj -c Release -o artifacts\payload
      - name: Build standalone installer
        run: dotnet publish src\BatteryPilot.Installer\Installer.csproj -c Release -o artifacts\release /p:PayloadDirectory="${{ github.workspace }}\artifacts\payload"
      - name: Create checksum
        shell: pwsh
        run: |
          Remove-Item artifacts\release\*.config -Force -ErrorAction SilentlyContinue
          (Get-FileHash artifacts\release\BatteryPilot-Setup.exe -Algorithm SHA256).Hash + '  BatteryPilot-Setup.exe' | Set-Content artifacts\release\BatteryPilot-Setup.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryPilot-Setup
          path: |
            artifacts/release/BatteryPilot-Setup.exe
            artifacts/release/BatteryPilot-Setup.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/BatteryPilot-Setup.exe
            artifacts/release/BatteryPilot-Setup.sha256
